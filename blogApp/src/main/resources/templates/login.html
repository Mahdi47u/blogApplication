<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Sign In</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/login.css}">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h2>Sign In</h2>
            <p>Enter your credentials to access your account</p>
        </div>

        <div th:if="${param.error}" class="error-message show">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="success-message show">
            <span class="success-icon">✓</span>
            <h3>Logged Out</h3>
            <p>You have been successfully logged out.</p>
        </div>

        <form id="loginForm" th:action="@{/login}" method="post" class="login-form">
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" required>
                    <label for="username">Username</label>
                </div>
                <span id="username-error" class="error-message"></span>
            </div>

            <div class="form-group password-wrapper">
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" required>
                    <label for="password">Password</label>
                    <button type="button" id="passwordToggle" class="password-toggle">
                        <span class="eye-icon"></span>
                    </button>
                </div>
                <span id="password-error" class="error-message"></span>
            </div>

            <div class="form-options">
                <label class="remember-wrapper">
                    <input type="checkbox" name="remember-me">
                    <span class="checkbox-label">
                            <span class="checkmark"></span> Remember me
                        </span>
                </label>
                <a th:href="@{/forgot-password}" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">
                <span class="btn-text">Sign In</span>
                <span class="btn-loader"></span>
            </button>
        </form>

        <div class="signup-link">
            <p>Don't have an account? <a th:href="@{/register}">Create one</a></p>
        </div>
    </div>

    <div id="successMessage" class="success-message">
        <span class="success-icon">✓</span>
        <h3>Login Successful!</h3>
        <p>Redirecting to your dashboard...</p>
    </div>
</div>

<script th:src="@{/login.js}"></script>
</body>
</html>
