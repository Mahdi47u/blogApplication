<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Posts</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/login.css}">
<!--    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">-->
</head>
<body>
<div class="container mt-5">
    <h2>Blog Posts</h2>
    <p>Welcome, <span th:text="${#authentication.name}"></span>!</p>
    <a th:href="@{/logout}" class="btn btn-secondary mb-3">Logout</a>
    <div th:each="post : ${posts}" class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${post.title}"></h5>
            <p class="card-text" th:text="${post.content}"></p>
            <a th:href="@{/comments(postId=${post.id})}" class="btn btn-primary">View Comments</a>
        </div>
    </div>
</div>
</body>
</html>
